<header class="topbar">
  <div class="brand"><i></i>Downloader</div>
  <nav class="tabs" aria-label="Sections">
    @for (t of tabs; track t.path) {
      <a [routerLink]="t.path" routerLinkActive="on" ariaCurrentWhenActive="page"
         [routerLinkActiveOptions]="{ exact: t.exact }">
        {{ t.label }}
        @if (t.path === '/' && activeCount() > 0) {
          <em aria-label="{{ activeCount() }} actifs ou en erreur">{{ activeCount() }}</em>
        }
      </a>
    }
  </nav>
  <div class="chips">
    @if (alldebrid(); as a) {
      <span class="chip" [title]="'AllDebrid : ' + a.text"><span class="dot {{ a.cls }}"></span>AllDebrid<span class="short">{{ a.short }}</span><span class="detail">{{ a.text }}</span></span>
    }
    @if (deezer(); as d) {
      <span class="chip" [title]="'Deezer : ' + d.text"><span class="dot {{ d.cls }}"></span>Deezer<span class="short">{{ d.short }}</span>@if (d.cls) {<span class="detail">{{ d.text }}</span>}</span>
    }
    @if (free(); as f) {
      <span class="chip"><span class="dot info"></span>{{ f }}</span>
    }
  </div>
</header>
<main><router-outlet /></main>
